name: runner-passive-inventory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Passive runner inventory
        run: |
          set -eu
          echo "=== Kernel ==="
          echo "Runner label: ${{ matrix.runner }}"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a
          cat /proc/version
          echo
          echo "=== Virtualization ==="
          systemd-detect-virt || true
          systemd-detect-virt --vm --list || true
          cat /sys/class/dmi/id/sys_vendor 2>/dev/null || true
          cat /sys/class/dmi/id/product_name 2>/dev/null || true
          cat /sys/hypervisor/type 2>/dev/null || true
          echo
          echo "=== Network interfaces ==="
          for nic in /sys/class/net/*; do
            name="${nic##*/}"
            echo "--- $name ---"
            readlink -f "$nic/device/driver" 2>/dev/null || echo "driver: (none)"
          done
          echo
          echo "=== NIC driver details and offloads ==="
          for name in $(ls /sys/class/net); do
            echo "--- $name ---"
            ethtool -i "$name" 2>/dev/null || true
            ethtool -k "$name" 2>/dev/null | sed -n '1,80p' || true
          done
          echo
          echo "=== Kernel modules (virtio/hv/net) ==="
          lsmod | grep -Ei 'virtio|hv_|netvsc|hv_netvsc' || echo "(no matching modules loaded)"
          echo
          echo "=== Harmless AF_PACKET prerequisites ==="
          grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status || true
          if command -v python3 >/dev/null; then
            python3 - <<'PY'
          import socket

          try:
              packet = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(3))
              print("AF_PACKET SOCK_RAW: available")
              try:
                  packet.setsockopt(263, 15, 1)  # SOL_PACKET, PACKET_VNET_HDR
                  print("PACKET_VNET_HDR: accepted")
              finally:
                  packet.close()
          except OSError as error:
              print(f"AF_PACKET SOCK_RAW: rejected ({error})")
          print("No packet was constructed or transmitted.")
          PY
          else
            echo "python3 unavailable; socket prerequisite not tested"
          fi
          echo
          echo "=== Unprivileged namespace prerequisite ==="
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true
          cat /proc/sys/user/max_user_namespaces 2>/dev/null || true
          if command -v unshare >/dev/null && command -v python3 >/dev/null; then
            unshare -Urn python3 - <<'PY' || true
          import socket

          try:
              packet = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(3))
              print("user+net namespace AF_PACKET: available")
              try:
                  packet.setsockopt(263, 15, 1)
                  print("user+net namespace PACKET_VNET_HDR: accepted")
              finally:
                  packet.close()
          except OSError as error:
              print(f"user+net namespace AF_PACKET: rejected ({error})")
          print("No packet was constructed or transmitted.")
          PY
          else
            echo "unshare or python3 unavailable; namespace prerequisite not tested"
          fi
      - name: Publish concise inventory
        shell: bash
        run: |
          kernel=$(uname -r)
          virt=$(systemd-detect-virt 2>/dev/null || echo unknown)
          drivers=""
          for nic in /sys/class/net/*; do
            name="${nic##*/}"
            driver=$(ethtool -i "$name" 2>/dev/null | awk '/^driver:/{print $2}')
            [ -n "$driver" ] && drivers="${drivers}${name}:${driver},"
          done
          modules=$(lsmod | awk 'tolower($1) ~ /virtio|hv_|netvsc/ {printf "%s,", $1}')
          [ -n "$modules" ] || modules="none"
          message="kernel=$kernel; virt=$virt; drivers=${drivers:-none}; modules=$modules"
          echo "::notice title=${{ matrix.runner }} passive inventory::$message"
